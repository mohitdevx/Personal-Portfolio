# Settings for the [build] key are global and applied to all deploy contexts
[build]
  # Publish directory containing Vite's production build output
  publish = "dist"
  
  # Default build command
  command = "npm run build"

# Production context settings
[context.production.environment]
  NODE_VERSION = "22"

[context.deploy-preview.environment]
  NODE_ENV = "development"

# SPA redirect: redirect all requests to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
   
