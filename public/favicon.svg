<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="m-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#101013" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="m-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.4" />
    </linearGradient>

    <!-- Left Ribbon: Titanium White -->
    <linearGradient id="m-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f4f4f5" />
      <stop offset="100%" stop-color="#d4d4d8" />
    </linearGradient>

    <!-- Right Ribbon: Neon Cyber Emerald -->
    <linearGradient id="m-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Ambient Emerald Glow -->
    <filter id="m-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Squircle Foundation -->
  <rect
    x="2"
    y="2"
    width="60"
    height="60"
    rx="16"
    fill="url(#m-bg)"
    stroke="url(#m-border)"
    stroke-width="1.2"
  />

  <!-- Ambient Glow Center -->
  <circle cx="32" cy="32" r="14" fill="#10b981" fill-opacity="0.15" filter="url(#m-glow)" />

  <!-- Left Wing (White/Titanium): Ascends from bottom-left, cuts down to center apex -->
  <path
    d="M 16 46 
       L 16 19.5 
       C 16 18.1 17.1 17 18.5 17 
       L 22 17 
       C 22.8 17 23.6 17.4 24.1 18.1 
       L 31 28.5 
       L 31 38 
       L 22.5 25.5 
       L 22.5 46 
       Z"
    fill="url(#m-white)"
  />

  <!-- Right Wing (Emerald): Ascends from center fold, peaks and drops with a 45° terminal slash -->
  <path
    d="M 33 28.5 
       L 39.9 18.1 
       C 40.4 17.4 41.2 17 42 17 
       L 45.5 17 
       C 46.9 17 48 18.1 48 19.5 
       L 48 41 
       L 43 46 
       L 41.5 46 
       L 41.5 25.5 
       L 33 38 
       Z"
    fill="url(#m-emerald)"
    filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))"
  />

  <!-- Central Emerald Terminal Pulse -->
  <circle cx="32" cy="33" r="1.8" fill="#34d399" filter="url(#m-glow)" />
</svg>